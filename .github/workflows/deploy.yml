# Generated by `mycelium publish`. Deploys the redaction-checked notes to
# GitHub Pages using Quartz (Quartz consumes YAML-frontmatter Markdown, which
# matches Mycelium's output). Adjust the branch / node version as needed.
name: Deploy Mycelium notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build with Quartz
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git .quartz
          rm -rf .quartz/content && mkdir -p .quartz/content
          cp -r content/* .quartz/content/
          cd .quartz && npm ci && npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
